# Managed demo deployment: one same-origin web/API service, one BullMQ worker,
# managed PostgreSQL, and persistent Redis-compatible Key Value. Kafka is
# intentionally disabled; PostgreSQL remains authoritative for application data.
services:
  - type: web
    name: parallax-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node src/server.js
    preDeployCommand: npm run db:migrate:prod
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parallax-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: parallax-queue
          type: keyvalue
          property: connectionString
      - key: TOKEN_SIGNING_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: STREAMING_ENABLED
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: WORKER_CONCURRENCY
        value: "4"
    initialDeployHook: npm run db:seed:prod

  - type: worker
    name: parallax-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/worker.js
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parallax-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: parallax-queue
          type: keyvalue
          property: connectionString
      - key: TOKEN_SIGNING_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: STREAMING_ENABLED
        value: "false"
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: TRUST_PROXY_HOPS
        value: "1"

  - type: keyvalue
    name: parallax-queue
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: parallax-postgres
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: parallax
    user: parallax_app
    diskSizeGB: 5
